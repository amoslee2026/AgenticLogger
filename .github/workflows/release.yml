name: Release

# Publish agentic-logger to npm, PyPI and crates.io.
#
# Two triggers:
#   1. Version tag push — the tag is the single source of truth for the version.
#        git tag v0.1.0 && git push origin v0.1.0
#   2. workflow_dispatch (manual) — reuses the version already in each manifest.
#        Useful to publish a registry whose token arrived later, without
#        bumping the other registries.
#
# Jobs whose token is absent are skipped (not failed), via the `check` job —
# GitHub forbids reading `secrets` directly in a job/step `if:`.
#
# Required repository secrets (GitHub → Settings → Secrets and variables →
# Actions). Never commit them — this repo is public.
#
#   NPM_TOKEN            npm publish token (https://www.npmjs.com → Access Tokens)
#   PYPI_TOKEN           PyPI API token, scoped to agentic-logger
#   CARGO_REGISTRY_TOKEN crates.io API token (https://crates.io/settings/tokens)
#
# PyPI may instead use trusted publishing (OIDC, no token): enable it under
# PyPI → Project → Publishing → Add a new trusted publisher for this
# repo + workflow, then delete the `password:` line below.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # Only needed for PyPI trusted publishing (OIDC); harmless with API tokens.
  id-token: write

jobs:
  check:
    name: Detect configured registries
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.detect.outputs.npm }}
      pypi: ${{ steps.detect.outputs.pypi }}
      crates: ${{ steps.detect.outputs.crates }}
    steps:
      - id: detect
        env:
          HAS_NPM: ${{ secrets.NPM_TOKEN }}
          HAS_PYPI: ${{ secrets.PYPI_TOKEN }}
          HAS_CRATES: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "npm=$([[ -n "$HAS_NPM" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "pypi=$([[ -n "$HAS_PYPI" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "crates=$([[ -n "$HAS_CRATES" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish npm (agentic-logger)
    needs: check
    if: needs.check.outputs.npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Resolve version
        working-directory: sdks/ts
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Install + build
        working-directory: sdks/ts
        run: npm ci && npm run build
      - name: Publish
        working-directory: sdks/ts
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish PyPI (agentic-logger)
    needs: check
    if: needs.check.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" pyproject.toml
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Delete this line to switch to trusted publishing (OIDC).
          password: ${{ secrets.PYPI_TOKEN }}

  publish-crates:
    name: Publish crates.io (agentic-logger)
    needs: check
    if: needs.check.outputs.crates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve version
        working-directory: sdks/rust
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
      - name: Publish
        working-directory: sdks/rust
        run: cargo publish --allow-dirty --registry crates-io --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
