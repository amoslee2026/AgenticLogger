name: Release

# Auto-publish agentic-logger to npm, PyPI and crates.io on every push to main.
#
#   • push to main   → auto-bump the PATCH version (0.1.0 → 0.1.1) across the
#                      three manifests, publish all three registries, then
#                      commit the version bump back as `[skip ci]`.
#   • commit message starting with `[skip ci]` → skipped (prevents loops and
#                      gives you an opt-out for docs-only changes).
#   • workflow_dispatch (manual) → re-publish the current manifest version to
#                      one chosen registry (no bump). Use it to retry a failed
#                      publish without wasting a version number.
#
# Major/minor bumps are manual: edit the version in pyproject.toml before
# pushing; the workflow bumps only the patch segment from there.
#
# Secrets (GitHub → Settings → Secrets and variables → Actions), never in-repo:
#   NPM_TOKEN            npm token (https://www.npmjs.com → Access Tokens)
#   CARGO_REGISTRY_TOKEN crates.io token (https://crates.io/settings/tokens)
# PyPI uses trusted publishing (OIDC, no token) — see PyPI → Project →
# Publishing → trusted publisher for amoslee2026/AgenticLogger + release.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Registry to publish (push publishes all)"
        required: true
        type: choice
        default: all
        options: [all, npm, pypi, crates]

permissions:
  contents: write
  # Required for PyPI trusted publishing (OIDC).
  id-token: write

jobs:
  bump:
    name: Prepare version
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.done.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bump patch version (push only)
        id: bump
        run: |
          CUR=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [[ "${{ github.event_name }}" == "push" ]]; then
            IFS='.' read -r M m p <<< "$CUR"
            NEW="$M.$m.$((p + 1))"
            sed -i "0,/^version = .*/s//version = \"$NEW\"/" pyproject.toml
            (cd sdks/ts && npm version "$NEW" --no-git-tag-version)
            sed -i "0,/^version = .*/s//version = \"$NEW\"/" sdks/rust/Cargo.toml
          else
            NEW="$CUR"
          fi
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "NEW_VERSION=$NEW" >> "$GITHUB_ENV"
      - name: Commit + push version bump
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml sdks/ts/package.json sdks/ts/package-lock.json sdks/rust/Cargo.toml
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || echo "no version change to commit"
          git push origin HEAD
      - name: Record sha
        id: done
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    name: Detect configured registries
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.detect.outputs.npm }}
      pypi: ${{ steps.detect.outputs.pypi }}
      crates: ${{ steps.detect.outputs.crates }}
    steps:
      - id: detect
        env:
          HAS_NPM: ${{ secrets.NPM_TOKEN }}
          HAS_CRATES: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="${{ github.event.inputs.target }}"
          else
            TARGET="all"
          fi
          npm=false; pypi=true; crates=false
          case "$TARGET" in
            npm)    npm=$([[ -n "$HAS_NPM"   ]] && echo true || echo false) ;;
            pypi)   ;;  # trusted publishing needs no token, always eligible
            crates) crates=$([[ -n "$HAS_CRATES" ]] && echo true || echo false) ;;
            all)
              npm=$([[ -n "$HAS_NPM"   ]] && echo true || echo false)
              crates=$([[ -n "$HAS_CRATES" ]] && echo true || echo false)
              ;;
          esac
          echo "npm=$npm" >> "$GITHUB_OUTPUT"
          echo "pypi=$pypi" >> "$GITHUB_OUTPUT"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish npm (agentic-logger)
    needs: [bump, check]
    if: needs.check.outputs.npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install + build
        working-directory: sdks/ts
        run: npm ci && npm run build
      - name: Publish
        working-directory: sdks/ts
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish PyPI (agentic-logger)
    needs: [bump, check]
    if: needs.check.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-crates:
    name: Publish crates.io (agentic-logger)
    needs: [bump, check]
    if: needs.check.outputs.crates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        working-directory: sdks/rust
        run: cargo publish --allow-dirty --registry crates-io --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
