[project]
name = "agentic-logger"
version = "0.1.1"
description = "Structured logging for Coding Agents - write once, read efficiently"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{ name = "AgenticLogger contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/amoslee2026/AgenticLogger"
Repository = "https://github.com/amoslee2026/AgenticLogger"
Issues = "https://github.com/amoslee2026/AgenticLogger/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
agentic-logger = "agentic_logger.cli:main"
agentic-logger-mcp = "agentic_logger.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_logger"]

[tool.hatch.build.targets.sdist]
exclude = [
  "temp/", "logs/", "sdks/", "research_reports/", ".skills_local/",
  "debug_artifacts/", "search_results/", "fetch_results/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agentic_logger"]

[tool.ruff]
line-length = 100
target-version = "py310"

[dependency-groups]
dev = []
