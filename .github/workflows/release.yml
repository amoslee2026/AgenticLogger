name: Release

# Publish agentic-logger to npm, PyPI and crates.io on version tags.
#
# Usage: tag the release commit and push it — the tag is the single source of
# truth for the version (no manual version bumps in the three manifests).
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Required repository secrets (GitHub → Settings → Secrets and variables →
# Actions). Never commit them — this repo is public.
#
#   NPM_TOKEN            npm publish token (https://www.npmjs.com → Access Tokens)
#   PYPI_TOKEN           PyPI API token, scoped to agentic-logger
#   CARGO_REGISTRY_TOKEN crates.io API token (https://crates.io/settings/tokens)
#
# PyPI may instead use trusted publishing (OIDC, no token): enable it under
# PyPI → Project → Publishing → Add a new trusted publisher for this
# repo + workflow, then delete the `password:` line below.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Only needed for PyPI trusted publishing (OIDC); harmless with API tokens.
  id-token: write

jobs:
  publish-npm:
    name: Publish npm (agentic-logger)
    if: ${{ secrets.NPM_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Sync version from tag
        working-directory: sdks/ts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Install + build
        working-directory: sdks/ts
        run: npm ci && npm run build
      - name: Publish
        working-directory: sdks/ts
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish PyPI (agentic-logger)
    if: ${{ secrets.PYPI_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" pyproject.toml
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Delete this line to switch to trusted publishing (OIDC).
          password: ${{ secrets.PYPI_TOKEN }}

  publish-crates:
    name: Publish crates.io (agentic-logger)
    if: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync version from tag
        run: |
          cd sdks/rust
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
      - name: Publish
        working-directory: sdks/rust
        run: cargo publish --allow-dirty --registry crates-io --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
